<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #374151);
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #pesan {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Daftar Akun</h1>
    <p class="subtitle">Buat akun baru untuk melanjutkan</p>

    <form id="formDaftar">

      <label for="nama">Nama</label>
      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        required
      >

      <button type="submit">Daftar</button>

    </form>

    <div id="pesan"></div>

    <div class="login">
      Sudah punya akun?
      <a href="login.html">Login di sini</a>
    </div>
  </div>

  <script>
    document.getElementById("formDaftar").addEventListener("submit", function(event) {
      event.preventDefault();

      const nama = document.getElementById("nama").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const pesan = document.getElementById("pesan");

      if (!nama || !email || !password) {
        pesan.textContent = "Semua kolom harus diisi.";
        return;
      }

      if (password.length < 6) {
        pesan.textContent = "Password minimal 6 karakter.";
        return;
      }

      const akun = {
        nama: nama,
        email: email,
        password: password
      };

      localStorage.setItem("akunPengguna", JSON.stringify(akun));

      pesan.textContent = "Pendaftaran berhasil! Mengarahkan ke Login...";

      setTimeout(function() {
        window.location.href = "login.html";
      }, 1000);
    });
  </script>

</body>
</html>

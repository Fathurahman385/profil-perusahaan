<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Akun</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #374151);
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    .daftar {
      text-align: center;
      margin-top: 20px;
    }

    .daftar a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #pesan {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Login</h1>
    <p class="subtitle">Masuk ke akun Anda</p>

    <form id="formLogin">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        required
      >

      <button type="submit">Login</button>

    </form>

    <div id="pesan"></div>

    <div class="daftar">
      Belum punya akun?
      <a href="daftar.html">Daftar di sini</a>
    </div>
  </div>

  <script>
    document.getElementById("formLogin").addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const pesan = document.getElementById("pesan");

      const dataAkun = localStorage.getItem("akunPengguna");

      if (!dataAkun) {
        pesan.textContent = "Akun belum terdaftar. Silakan daftar terlebih dahulu.";
        return;
      }

      const akun = JSON.parse(dataAkun);

      if (email === akun.email && password === akun.password) {

        localStorage.setItem("sudahLogin", "true");

        pesan.textContent = "Login berhasil!";

        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 800);

      } else {
        pesan.textContent = "Email atau password salah.";
      }
    });
  </script>

</body>
</html>

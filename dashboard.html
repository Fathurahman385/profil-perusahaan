<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Website Perusahaan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    .logout {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout:hover {
      background: #b91c1c;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .welcome h1 {
      margin-top: 0;
    }

    .email {
      color: #2563eb;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-top: 0;
    }
  </style>
</head>

<body>

  <header>
    <h2>Dashboard Perusahaan</h2>
    <button class="logout" onclick="logout()">Logout</button>
  </header>

  <main>

    <section class="welcome">
      <h1>Selamat Datang 👋</h1>

      <p>
        Anda berhasil login ke dalam dashboard.
      </p>

      <p>
        Email akun:
        <span class="email" id="emailPengguna"></span>
      </p>
    </section>

    <section class="cards">

      <div class="card">
        <h3>Profil Perusahaan</h3>
        <p>Informasi mengenai perusahaan.</p>
      </div>

      <div class="card">
        <h3>Data Pengguna</h3>
        <p>Kelola informasi akun pengguna.</p>
      </div>

      <div class="card">
        <h3>Dashboard</h3>
        <p>Anda sedang berada di halaman utama.</p>
      </div>

    </section>

  </main>

  <script>
    // Cek apakah pengguna sudah login
    if (localStorage.getItem("sudahLogin") !== "true") {
      window.location.href = "login.html";
    }

    // Tampilkan email pengguna
    const dataAkun = localStorage.getItem("akunPengguna");

    if (dataAkun) {
      const akun = JSON.parse(dataAkun);
      document.getElementById("emailPengguna").textContent = akun.email;
    }

    // Fungsi logout
    function logout() {
      localStorage.removeItem("sudahLogin");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
